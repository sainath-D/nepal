[build]
  command = "npm ci && npm run build"
  publish = "dist/public"
  functions = "netlify/functions"

[[redirects]]
  # Proxy API requests to the backend service. Replace the target with your backend URL.
  from = "/api/*"
  to = "https://nsn-science-fair-backend.example.com/:splat"
  status = 200
  force = false
